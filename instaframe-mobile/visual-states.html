<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InstaFrame mobile - état visuel</title><style>*{box-sizing:border-box}html,body{margin:0;background:#e7e7e5;font:13px Arial,sans-serif}header{min-height:42px;display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid #ccc;background:white}header strong{font-size:13px}header span{color:#555}main{padding:0}img{display:block;width:100%;height:auto}#source{margin-left:auto;font-size:12px}</style></head><body><header><strong id="title"></strong><span id="variant"></span><span id="source"></span></header><main><img id="state" alt=""></main><script type="module">
const data=await(await fetch('../instaframe-copy/visual-states.json')).json(),params=new URLSearchParams(location.search),item=data.find(v=>v.id===params.get('state'))||data[0];document.querySelector('#title').textContent=item.label;document.querySelector('#source').textContent=item.type==='source-local'?'État source local, non vérifié connecté':'État visuel comparé au site';function draw(){const v=item.variants.find(v=>v.width===(innerWidth<1024?768:1440))||item.variants[0];document.querySelector('#variant').textContent='Capture '+v.width+' × 1000 · '+v.language.toUpperCase();const img=document.querySelector('#state');img.src='../instaframe-copy/'+v.src.replace(/^\.\//,'');img.alt=item.label+' - '+v.width+' pixels, '+v.language.toUpperCase()}addEventListener('resize',draw);draw();
</script></body></html>
